<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - Full Stack App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>📋 Task Manager</h1>
            <p class="subtitle">A Full-Stack Learning Project</p>
        </header>

        <!-- Stats Section -->
        <section class="stats-section">
            <div class="stat-card">
                <div class="stat-number" id="totalTasks">0</div>
                <div class="stat-label">Total Tasks</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="completedTasks">0</div>
                <div class="stat-label">Completed</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="pendingTasks">0</div>
                <div class="stat-label">Pending</div>
            </div>
        </section>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Left Column: Create/Add Form -->
            <section class="form-section">
                <h2>Create New Task</h2>
                <form id="taskForm" class="task-form">
                    <!-- Title Input -->
                    <div class="form-group">
                        <label for="taskTitle">Task Title *</label>
                        <input 
                            type="text" 
                            id="taskTitle" 
                            name="title" 
                            placeholder="What needs to be done?"
                            required
                            maxlength="200"
                        >
                        <small class="char-count">0 / 200</small>
                    </div>

                    <!-- Description Input -->
                    <div class="form-group">
                        <label for="taskDescription">Description</label>
                        <textarea 
                            id="taskDescription" 
                            name="description" 
                            placeholder="Add more details about this task..."
                            rows="4"
                            maxlength="2000"
                        ></textarea>
                        <small class="char-count">0 / 2000</small>
                    </div>

                    <!-- Completed Status -->
                    <div class="form-group checkbox">
                        <input 
                            type="checkbox" 
                            id="taskCompleted" 
                            name="completed"
                        >
                        <label for="taskCompleted">Mark as completed</label>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary">
                        ➕ Add Task
                    </button>
                </form>
            </section>

            <!-- Right Column: Tasks List -->
            <section class="tasks-section">
                <h2>Your Tasks</h2>

                <!-- Filter Buttons -->
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="pending">Pending</button>
                    <button class="filter-btn" data-filter="completed">Completed</button>
                </div>

                <!-- Error Message Display -->
                <div id="errorMessage" class="error-message" style="display: none;"></div>

                <!-- Loading State -->
                <div id="loadingSpinner" class="loading-spinner" style="display: none;">
                    <div class="spinner"></div>
                    <p>Loading tasks...</p>
                </div>

                <!-- Tasks List -->
                <div id="tasksList" class="tasks-list">
                    <!-- Tasks will be inserted here by JavaScript -->
                </div>

                <!-- Empty State -->
                <div id="emptyState" class="empty-state" style="display: none;">
                    <p>✨ No tasks found. Create one to get started!</p>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>Learning Full-Stack Development | API Status: <span id="apiStatus">Checking...</span></p>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="script.js"></script>
</body>
</html>
